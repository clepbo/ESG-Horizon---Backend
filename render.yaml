# Render Blueprint for the ESG Horizon DEMO environment.
#
# Deploys three things: a Postgres database, the NestJS API, and the Next.js
# frontend. The API seeds itself on first boot, so the demo is populated and
# logged-into within a few minutes of the deploy finishing.
#
# This describes a DEMO instance only. It is not a production topology:
# free-tier services sleep when idle, the database is disposable, and CORS is
# wide open. Do not point it at anything real.
#
# Usage: https://dashboard.render.com/blueprints → New Blueprint Instance →
# pick this repository. See DEPLOY.md for the walkthrough.

databases:
  - name: esg-horizon-demo-db
    databaseName: horizon_demo
    user: horizon
    plan: free

services:
  # ---------------------------------------------------------------------------
  # API (NestJS + Prisma)
  # ---------------------------------------------------------------------------
  - type: web
    name: esg-horizon-demo-api
    runtime: docker
    plan: free
    region: oregon
    branch: claude/nifty-ritchie-yeqjdi
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: esg-horizon-demo-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: esg-horizon-demo-db
          property: connectionString

      # Throwaway signing key, generated by Render and never seen by anyone.
      # This is NOT the production JWT secret and must never be set to it.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRESIN
        value: 1d

      # Turns on the demo seed. Without this the seed refuses to run.
      - key: DEMO_MODE
        value: "true"

      # Render's managed Postgres hostname ends in .render.com, which the demo
      # guard treats as a managed host and blocks by default. This instance is
      # exactly the disposable case that escape hatch exists for.
      - key: DEMO_ALLOW_RISKY_URL
        value: "true"

      # Demo-only. The API's CORS handler treats "*" as allow-all, which avoids
      # a circular reference between these two services. Never use this on a
      # real deployment.
      - key: ALLOWED_ORIGINS
        value: "*"

      - key: NODE_ENV
        value: production

      # Left blank on purpose: no email or uploads in the demo. Fill with
      # sandbox keys only if you want to exercise those flows.
      - key: BREVO_API_KEY
        value: ""
      - key: SENDER_EMAIL
        value: demo@example.invalid
      - key: CLOUDINARY_CLOUD_NAME
        value: ""
      - key: CLOUDINARY_API_KEY
        value: ""
      - key: CLOUDINARY_API_SECRET
        value: ""
      - key: UPLOAD_DEFAULT_FOLDER
        value: demo-uploads
      - key: UPLOAD_MAX_FILE_SIZE
        value: "5242880"

  # ---------------------------------------------------------------------------
  # Frontend (Next.js standalone)
  # ---------------------------------------------------------------------------
  - type: web
    name: esg-horizon-demo-web
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/clepbo/ESG-Horizon---Frontend
    branch: claude/nifty-ritchie-yeqjdi
    dockerfilePath: ./Dockerfile
    envVars:
      # NEXT_PUBLIC_* is baked into the client bundle at build time; the
      # Dockerfile declares a matching ARG so Render passes it through.
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          name: esg-horizon-demo-api
          type: web
          property: host

      # lib/supabase.ts throws at import time without these, which fails the
      # Next.js build. Supabase only backs social login, which the demo does not
      # use, so placeholders are sufficient. Replace with real values only if you
      # want social login working in the demo.
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://demo-placeholder.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: demo-placeholder-anon-key

      - key: NODE_ENV
        value: production
