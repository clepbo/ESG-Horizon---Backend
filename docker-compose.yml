services:
  dev-db:
    image: postgres:15
    restart: always
    container_name: nestjs_postgres
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: REDACTED_SECRET
      POSTGRES_DB: esg_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
