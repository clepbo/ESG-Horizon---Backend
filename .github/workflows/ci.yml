name: NestJS CI/CD
on:
  push:
    branches: [main, staging]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --no-immutable
      - name: Prisma generate
        run: npx prisma generate --schema=./prisma/schema
      - name: Build project
        run: yarn build

      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TARGET_DIR=/var/www/esghorizon/backend" >> $GITHUB_ENV
            echo "APP_NAME=esg-backend-prod" >> $GITHUB_ENV
            echo "PORT=3000" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=/var/www/esghorizon/backend-staging" >> $GITHUB_ENV
            echo "APP_NAME=esg-backend-staging" >> $GITHUB_ENV
            echo "PORT=4000" >> $GITHUB_ENV
          fi

      - name: Transfer Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist,package.json,.yarn,.yarnrc.yml,prisma'
          target: ${{ env.TARGET_DIR }}

      - name: Start via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ${{ env.TARGET_DIR }}
            corepack enable
            yarn install
            yarn prisma migrate deploy
            pm2 delete ${{ env.APP_NAME }} || true
            PORT=${{ env.PORT }} pm2 start dist/src/main.js --name "${{ env.APP_NAME }}" --node-args="-r dotenv/config"
            pm2 save